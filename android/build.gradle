// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Expo generates PackageList.java during autolinking. Gradle 9 validates task
// inputs strictly, so ensure Expo's sources JAR waits for that generated source.
subprojects { subproject ->
  if (subproject.name == 'expo') {
    subproject.tasks.matching { it.name == 'releaseSourcesJar' }.configureEach {
      dependsOn(subproject.tasks.matching { it.name == 'generatePackagesList' })
    }
  }

  // Gradle 9 strictly validates task dependencies when packaging sources JARs.
  // Wire dependencies to codegen tasks so Gradle validation passes, and disable sourcesJar since they are unneeded for APK builds.
  subproject.tasks.matching { it.name.endsWith('SourcesJar') }.configureEach {
    dependsOn(subproject.tasks.matching { it.name.startsWith('generateCodegen') })
    enabled = false
  }

  subproject.tasks.matching { it.name == 'clean' }.configureEach {
    doLast {
      delete "${subproject.projectDir}/.cxx"
    }
  }
}

// In React Native New Architecture, externalNativeBuildClean invokes CMake/Ninja
// clean, which crashes because standard clean wipes codegen header files before CMake reconfigures.
// Disabling these tasks allows gradlew clean to wipe build outputs cleanly without CMake errors.
gradle.taskGraph.whenReady { taskGraph ->
  taskGraph.allTasks.findAll { it.name.startsWith("externalNativeBuildClean") }.each {
    it.enabled = false
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
