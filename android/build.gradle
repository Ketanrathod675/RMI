// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Expo generates PackageList.java during autolinking. Gradle 9 validates task
// inputs strictly, so ensure Expo's sources JAR waits for that generated source.
subprojects { subproject ->
  if (subproject.name == 'expo') {
    subproject.tasks.matching { it.name == 'releaseSourcesJar' }.configureEach {
      dependsOn(subproject.tasks.matching { it.name == 'generatePackagesList' })
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
